<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>TettPå Ting &amp; Tang · versjon 9</title>
<style>
:root{--petrol:#0e5b61;--petrol-600:#0a4a4f;--petrol-050:#e7f1f1;--petrol-300:#4a9aa0;--amber:#d98324;--mist:#eef2f0;--paper:#fff;--ink:#16201d;--muted:#5f6f6a;--line:#dde4e1;--red:#c0413b;--green:#2f8f5b;--font-d:'Bricolage Grotesque',Inter,sans-serif;--font-b:Inter,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--mist);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.ph-h{background:var(--petrol);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;flex:0 0 auto}
.ph-h .a{font:700 22px var(--font-d)}.ph-h .b{font-size:12.5px;opacity:.85}
#warnbar:empty{display:none}
.warnbar{display:flex;gap:10px;align-items:flex-start;background:#fbeceb;border-bottom:2px solid var(--red);color:#7d1f1a;padding:10px 14px;font-size:13px;flex:0 0 auto}
.warnbar svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}
#ttv{flex:1 1 auto;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
.ph-ver{text-align:center;color:#8a9692;font-size:11.5px;margin:12px 0 6px}
.ph-nav{display:flex;border-top:1.5px solid var(--line);background:#fff;flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom)}
.ph-nav button{flex:1;border:none;background:none;padding:9px 2px 10px;font:700 11px Inter,system-ui;color:#6d7b77;cursor:pointer}
.ph-nav button.on{color:var(--petrol)}
.ph-nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);background:#16201d;color:#fff;border-radius:12px;padding:10px 16px;font:600 13px Inter,system-ui;display:none;z-index:9999;max-width:92vw;text-align:center}
#toast.on{display:block}
.tt-inp,.tt-sel,.tt-sok input,.tt-addk input,.tt-tagbox input{font-size:16px}
.tt-wrap{max-width:none}
/* ===== Ting & Tang ===== */
.tt-dp{display:block;width:100%;border:2px solid var(--petrol,#0e5b61);border-radius:11px;padding:13px 14px;background:var(--paper,#fff);font:700 14.5px system-ui;color:var(--ink,#16201d);cursor:pointer;text-align:center;margin-bottom:10px}
.tt-dp:hover,.tt-dp:active{background:var(--petrol-050,#e7f1f1)}
.tt-dpf{border-top:1.5px solid var(--line,#dde4e1);margin:4px -14px -14px;padding:12px 18px;display:flex;justify-content:flex-end}
.tt-dpf button{border:none;background:none;font:700 14.5px system-ui;color:#6a7a76;cursor:pointer}
.tt-fz{border:1.5px solid #e6c5c2;background:var(--paper,#fff);border-radius:14px;padding:14px;margin-bottom:10px;color:var(--ink,#16201d)}
.tt-fz h3{margin:0 0 10px;font:800 15px system-ui;color:#c0413b;display:flex;gap:7px;align-items:center}
.tt-fz h3 svg{width:17px;height:17px}
.tt-fzb{display:flex;gap:10px;flex-wrap:wrap}
.tt-fzb button{display:inline-flex;gap:7px;align-items:center;border-radius:11px;padding:9px 15px;font:800 13.5px system-ui;cursor:pointer;border:1.5px solid #b84a44;color:#9a2f2a;background:var(--paper,#fff)}
.tt-fzb button svg{width:16px;height:16px}
.tt-fzb button.w{background:#8a2a25;border-color:#8a2a25;color:#fff}
.tt-fzt{font-size:12.5px;color:var(--muted,#5f6f6a);margin:10px 0 0;line-height:1.5}
.tt-wrap{max-width:900px}
.tt-fr{border:1.5px solid #9bb3b1;border-radius:16px;background:var(--mist,#e6edeb);padding:8px;margin-bottom:8px}
.tt-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tt-chip{border:1.5px solid var(--line,#cfdad7);background:var(--paper,#fff);border-radius:999px;padding:7px 13px;font:800 12.5px var(--font-b,system-ui),system-ui,sans-serif;color:var(--petrol,#0e5b61);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tt-chip svg{width:15px;height:15px}
.tt-chip.dark{background:var(--petrol,#0e5b61);border-color:var(--petrol,#0e5b61);color:#fff}
.tt-chip.act{background:var(--petrol-050,#e7f1f1);border-color:var(--petrol,#0e5b61)}
.tt-vs{width:1.5px;height:22px;background:#bccbc8;margin:0 3px}
.tt-toolp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:800 11.5px system-ui;color:var(--muted,#5f6f6a)}
.tt-sok{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line,#cfdad7);background:var(--paper,#fff);border-radius:12px;padding:7px 11px;margin-bottom:8px}
.tt-sok svg{width:16px;height:16px;color:var(--muted,#5f6f6a);flex:0 0 auto}
.tt-sok input{flex:1;border:none;outline:none;font:600 14px system-ui;background:none;min-width:0;color:var(--ink,#16201d)}
.tt-cnt{font:800 11.5px system-ui;color:var(--petrol,#0e5b61);background:var(--petrol-050,#dcecee);border-radius:9px;padding:2px 9px;white-space:nowrap}
.tt-card{background:var(--paper,#fff);border:1.5px solid var(--line,#b9c8c5);border-radius:12px;padding:9px;margin-bottom:6px;display:flex;gap:10px;cursor:pointer;align-items:flex-start;color:var(--ink,#16201d)}
.tt-card:hover{border-color:var(--petrol,#0e5b61)}
.tt-th{width:56px;height:56px;border-radius:10px;flex:0 0 auto;background:#dfe8e6;object-fit:cover;display:flex;align-items:center;justify-content:center;font:800 20px system-ui;color:#5f7571}
.tt-c1{flex:1;min-width:0}.tt-c1 .tt-t{font:800 14.5px system-ui;word-break:break-word}
.tt-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tt-pill{border-radius:8px;padding:1px 8px;font:800 11px system-ui;background:#eef2f0;color:#4a5a56;white-space:nowrap}
.tt-pill.loc{background:#e6eefb;color:#245a99}.tt-pill.kol{background:#f3e8f7;color:#7a3a8f}.tt-pill.st{background:#e8f5ee;color:#2f7a52}.tt-pill.tg{background:#fdf1e0;color:#9a5d12}
.tt-right{text-align:right;flex:0 0 auto}.tt-right .tt-v{font:800 14px system-ui}.tt-right .tt-s{font:700 11px system-ui;color:var(--muted,#5f6f6a)}
.tt-badge{display:inline-block;border-radius:8px;padding:1px 8px;font:800 10.5px system-ui;margin-top:3px}
.tt-badge.ok{background:#e8f5ee;color:#2f8f5b}.tt-badge.warn{background:#fdf1e0;color:#a35f10}.tt-badge.exp{background:#fbeceb;color:#c0413b}.tt-badge.sold{background:#e6eefb;color:#245a99}
.tt-sum{border:2px solid var(--petrol,#0e5b61);border-radius:12px;background:var(--paper,#fff);padding:9px 12px;font:800 13px system-ui;display:flex;justify-content:space-between;margin-top:8px;color:var(--ink,#16201d)}
.tt-empty{color:var(--muted,#5f6f6a);padding:18px 4px;text-align:center;font-size:13.5px}
.tt-back{position:fixed;inset:0;background:rgba(18,30,28,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:9000}
.tt-dlg{background:var(--paper,#fff);border-radius:16px;width:100%;max-width:640px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);color:var(--ink,#16201d)}
.tt-dh{display:flex;align-items:center;font:800 16px system-ui;color:var(--petrol,#0e5b61);margin:0 0 10px}.tt-dh .tt-x{margin-left:auto;border:none;background:none;cursor:pointer;color:#5b6b66;padding:2px}.tt-dh .tt-x svg{width:20px;height:20px}
.tt-gf{border:var(--tbw,2px) solid var(--tbd,var(--petrol,#0e5b61));border-radius:11px;padding:var(--tpv,10px) var(--tph,12px);background:var(--tbg,var(--petrol-050,#e7f1f1));margin-bottom:var(--tgap,10px)}
.tt-gf .tt-lb{display:block;font:800 12px system-ui;color:var(--tlb,var(--petrol-600,#0b4a4f));margin:0 0 4px}
.tt-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tt-inp,.tt-sel{width:100%;border:1.5px solid var(--tib,#9cc4c6);border-radius:10px;padding:var(--tip,8px) 10px;font:600 14px system-ui;background:var(--paper,#fff);color:var(--ink,#16201d);box-sizing:border-box}
.tt-inp:focus,.tt-sel:focus{outline:none;box-shadow:0 0 0 3px rgba(14,91,97,.15)}
textarea.tt-inp{min-height:84px;resize:vertical;font-weight:500}
.tt-katrow{display:flex;gap:6px}.tt-katrow .tt-sel{flex:1}.tt-katrow button{border:1.5px solid var(--tib,#9cc4c6);background:var(--paper,#fff);border-radius:10px;padding:0 12px;font:800 15px system-ui;color:var(--petrol,#0e5b61);cursor:pointer}
.tt-tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px solid var(--tib,#9cc4c6);border-radius:10px;background:var(--paper,#fff);padding:6px 8px;min-height:40px}
.tt-tagbox .tt-pill{display:inline-flex;gap:5px;align-items:center}.tt-tagbox .tt-pill button{border:none;background:none;cursor:pointer;color:#9a5d12;font-size:12px;padding:0}
.tt-tagbox input{border:none;outline:none;flex:1;min-width:90px;font:600 13.5px system-ui;background:none;color:var(--ink,#16201d)}
.tt-sug{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tt-sug .tt-pill{cursor:pointer;opacity:.85}
.tt-imgs{display:flex;gap:8px;flex-wrap:wrap}
.tt-img{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1.5px solid var(--tib,#9cc4c6);background:#dfe8e6}
.tt-img img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.tt-img button{position:absolute;top:3px;right:3px;border:none;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px;line-height:1;padding:0}
.tt-img.first::after{content:"Forside";position:absolute;left:0;right:0;bottom:0;background:rgba(14,91,97,.85);color:#fff;font:800 10px system-ui;text-align:center;padding:1px;pointer-events:none}
.tt-addimg{width:84px;height:84px;border-radius:10px;border:2px dashed var(--petrol,#0e5b61);background:var(--paper,#fff);color:var(--petrol,#0e5b61);cursor:pointer;font:800 12px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tt-addimg b{font-size:22px;line-height:1}
.tt-foot{display:flex;gap:8px;justify-content:space-between;margin-top:6px}
.tt-bt{border:1.5px solid var(--line,#dde4e1);background:var(--paper,#fff);border-radius:10px;padding:8px 16px;font:800 13px system-ui;cursor:pointer;color:var(--ink,#16201d)}.tt-bt.p{background:var(--petrol,#0e5b61);border-color:var(--petrol,#0e5b61);color:#fff}.tt-bt.d{color:#c0413b}.tt-bt.dd{background:#c0413b;border-color:#c0413b;color:#fff}
.tt-gar{font:700 12px system-ui;margin-top:5px}
.tt-panel{background:var(--paper,#fff);border:1.5px solid var(--line,#dde4e1);border-radius:14px;padding:12px;margin-bottom:10px;color:var(--ink,#16201d)}
.tt-panel h3{margin:0 0 8px;font:800 14px system-ui;color:var(--petrol,#0e5b61)}
.tt-krow{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line,#dde4e1);border-radius:10px;padding:6px 10px;margin-bottom:4px;font-weight:700}
.tt-krow span{flex:1;word-break:break-word}.tt-krow small{color:var(--muted,#5f6f6a);font-weight:600}.tt-krow button{border:none;background:none;cursor:pointer;color:#8a938f;padding:2px}.tt-krow button:hover{color:#c0413b}.tt-krow button svg{width:15px;height:15px}
.tt-addk{display:flex;gap:6px;margin-top:6px}.tt-addk input{flex:1;border:1.5px solid var(--line,#cfdad7);border-radius:9px;padding:7px 10px;font:600 13px system-ui;min-width:0;background:var(--paper,#fff);color:var(--ink,#16201d)}
.tt-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.tt-stc{background:var(--mist,#f3f7f6);border-radius:10px;padding:8px;text-align:center}.tt-stc b{display:block;font:800 18px system-ui}.tt-stc span{font-size:11.5px;color:var(--muted,#5f6f6a)}
.tt-meta2{font-size:12px;color:var(--muted,#5f6f6a);display:flex;flex-direction:column;gap:2px}
.tt-sb{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line,#dde4e1);background:var(--paper,#fff);border-radius:12px;padding:10px 12px;width:100%;text-align:left;cursor:pointer;margin-bottom:6px;font-family:inherit;color:var(--ink,#16201d)}
.tt-sb svg{width:20px;height:20px;flex:0 0 auto;color:var(--petrol,#0e5b61)}
.tt-sb.pri{border-color:var(--petrol,#0e5b61);background:var(--petrol-050,#e7f1f1)}.tt-sb .tt-tt{display:block;font:800 13.5px system-ui}.tt-sb small{color:var(--muted,#5f6f6a);font-size:12px}
.tt-fname{font-size:11.5px;color:var(--muted,#5f6f6a);margin-top:6px;word-break:break-all}
.tt-drop{border:2px dashed #9cc4c6;border-radius:12px;padding:14px;text-align:center;color:var(--muted,#5f6f6a);font:700 12.5px system-ui;cursor:pointer;margin-top:6px}.tt-drop.drag{background:var(--petrol-050,#e7f1f1);border-color:var(--petrol,#0e5b61)}
.tt-res{background:#e8f5ee;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:8px;color:#1f5f3c}
.tt-lb2{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9500;display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}.tt-lb2 img{max-width:100%;max-height:100%;border-radius:8px}
.tt-store{margin-top:4px}
@media (max-width:560px){.tt-two{grid-template-columns:1fr 1fr}.tt-back{padding:12px 8px}.tt-dlg{padding:12px}}

.tt-dz{border:2.5px dashed var(--petrol,#0e5b61);border-radius:14px;background:var(--paper,#fff);padding:var(--tdzp,16px) 12px;text-align:center;color:var(--ink,#33524f);transition:.12s;margin-top:8px}
.tt-dz>svg{width:30px;height:30px;color:var(--petrol,#0e5b61)}
.tt-dz .tt-t1{font:800 14px system-ui;margin:4px 0 2px}.tt-dz .tt-t2{font-size:12px;color:var(--muted,#5f6f6a);margin-bottom:10px}
.tt-dz.over{background:var(--petrol-050,#d9ecee);border-style:solid;transform:scale(1.01)}
.tt-dbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tt-tip{font-size:11.5px;color:var(--muted,#5f6f6a);margin-top:8px}
.tt-imsg{font:700 12px system-ui;color:#1f5f3c;margin-top:6px;min-height:16px}
.tt-cam{background:#101a19;border-radius:14px;padding:10px;text-align:center;margin-top:8px}
.tt-cam video{width:100%;max-height:260px;border-radius:10px;background:#000;display:block;object-fit:cover}
.tt-vfn{color:#cfe3e1;font:600 13px system-ui;padding:30px 14px;line-height:1.5}
.tt-camrow{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.tt-camrow button{border:none;border-radius:10px;padding:9px 16px;font:800 13px system-ui;cursor:pointer;background:#fff;color:#0e5b61}
.tt-camrow button.tt-shut{background:#fff;border:4px solid #9fc9cc;width:54px;height:54px;border-radius:50%;padding:0}
.tt-cnt2{color:#cfe3e1;font:700 12px system-ui;margin-top:6px}

.tt-wrap mark{background:#ffe08a;color:inherit;border-radius:3px;padding:0 1px}
.tt-fsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.tt-fsel b{font:800 11.5px system-ui;color:var(--muted,#5f6f6a);letter-spacing:.03em;text-transform:uppercase;margin-right:2px}
.tt-fsel button{border:1.5px solid var(--line,#cfdad7);background:var(--paper,#fff);border-radius:999px;padding:5px 11px;font:800 12px system-ui;color:var(--ink,#33433f);cursor:pointer}
.tt-fsel button.on{background:var(--petrol,#0e5b61);border-color:var(--petrol,#0e5b61);color:#fff}
.tt-x2{border:none;background:none;cursor:pointer;color:#8a938f;font-size:15px;padding:0 2px}
.tt-snip{font-size:12.5px;color:var(--ink,#46524e);margin-top:5px;background:var(--mist,#f6f8f7);border-radius:8px;padding:4px 8px;line-height:1.4;word-break:break-word}
.tt-snip b{font:800 10.5px system-ui;color:var(--petrol,#0e5b61);text-transform:uppercase;letter-spacing:.03em;margin-right:5px}
.tt-treff{font:800 10.5px system-ui;color:#245a99;margin-top:4px}
.tt-res{font:700 12.5px system-ui;color:var(--muted,#5f6f6a);margin:2px 2px 8px}
.tt-hint{background:var(--paper,#fff);border:1.5px dashed #b9c8c5;border-radius:12px;padding:14px;text-align:center;color:var(--muted,#5f6f6a);font-size:13px}

.tt-sfr{border:1.5px solid #9bb3b1;border-radius:16px;background:var(--mist,#e6edeb);padding:8px;margin-bottom:10px}
.tt-sfr .tt-sok{margin-bottom:8px}.tt-sfr .tt-fsel{margin:0}
.tt-lf{border:1.5px solid #9bb3b1;border-radius:16px;background:var(--mist,#e6edeb);padding:8px;margin-bottom:10px}
.tt-lh{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;flex-wrap:wrap}
.tt-tg2{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font:800 14px system-ui;color:var(--petrol-600,#0b4a4f);padding:0}
.tt-tg2 svg{width:16px;height:16px;transition:.15s}.tt-tg2.cl svg{transform:rotate(-90deg)}
.tt-n{font:800 11.5px system-ui;color:var(--petrol,#0e5b61);background:var(--petrol-050,#dcecee);border-radius:9px;padding:2px 9px}
.tt-vsel{margin-left:auto;border:1.5px solid #9cc4c6;border-radius:10px;background:var(--paper,#fff);padding:6px 10px;font:800 12.5px system-ui;color:var(--petrol,#0e5b61);cursor:pointer}
.tt-lf #ttlist:empty{display:none}.tt-lf .tt-lh:has(+ #ttlist:empty){padding-bottom:2px}
.tt-more{display:block;width:100%;border:1.5px dashed var(--petrol,#0e5b61);background:var(--paper,#fff);color:var(--petrol,#0e5b61);border-radius:12px;padding:9px;font:800 13px system-ui;cursor:pointer;margin-top:2px}
.tt-more:hover{background:var(--petrol-050,#e7f1f1)}
.tt-ovl{position:absolute;inset:-2px;border-radius:11px;background:rgba(14,91,97,.92);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;font:800 16px system-ui;z-index:5;pointer-events:none}
.tt-ovl small{font:600 12px system-ui;opacity:.9;margin-top:4px}
.tt-gf{position:relative}
.tt-gf.over .tt-ovl{display:flex}

.tt-lev{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px;font:700 12.5px system-ui;color:#33433f;background:#f6f8f7;border-radius:9px;padding:6px 8px}
.tt-ln{flex:1 1 100%;min-width:0;line-height:1.4;word-break:break-word}
.tt-ln b{font:800 10.5px system-ui;color:var(--petrol,#0e5b61);text-transform:uppercase;letter-spacing:.03em;margin-right:6px}
.tt-ln a{color:#245a99;text-decoration:none;font-weight:700}.tt-ln a:hover{text-decoration:underline}
.tt-cp{border:1.5px solid #cfdad7;background:#fff;border-radius:8px;padding:3px 9px;font:800 11.5px system-ui;color:var(--petrol,#0e5b61);cursor:pointer;white-space:nowrap;display:inline-flex;gap:5px;align-items:center;flex:0 0 auto}
.tt-cp svg{width:13px;height:13px}.tt-cp.done{background:#e8f5ee;border-color:#2f8f5b;color:#1f6b42}
.tt-cp.big{padding:8px 11px;font-size:12.5px;border-radius:10px}

<script>
const BUILD_NO=9, BUILD_DATE='21.10.2026';
const TT_MAC=false;
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),3200);}

/* ---------- LAGRING: IndexedDB (bekreftet) -> localStorage -> minne ---------- */
const DB_KEY='tettpa-tingtang-iphone';
let db={tt:{},meta:{}};
let storeMode='minne', idb=null, saveErr=null, saveBusy=false, saveAgain=false, saveTimer=null, lastWarn=0;
function openIdb(){
  return new Promise(res=>{
    if(!('indexedDB' in window))return res(null);
    let req;
    try{req=indexedDB.open(DB_KEY,1);}catch(e){return res(null);}
    req.onupgradeneeded=()=>{try{req.result.createObjectStore('kv');}catch(e){}};
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>res(null);
    setTimeout(()=>res(null),2500);
  });
}
function idbGet(){
  return new Promise(res=>{
    if(!idb)return res(null);
    try{const r=idb.transaction('kv','readonly').objectStore('kv').get('state');
      r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}catch(e){res(null);}
  });
}
function idbPut(v){
  return new Promise((res,rej)=>{
    try{
      const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,'state');
      tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error||new Error('IndexedDB-feil'));tx.onabort=()=>rej(tx.error||new Error('IndexedDB avbrutt'));
    }catch(e){rej(e);}
  });
}
async function load(){
  idb=await openIdb();
  let lsVal=null;
  try{const raw=localStorage.getItem(DB_KEY);if(raw)lsVal=JSON.parse(raw);}catch(e){}
  if(idb){
    const v=await idbGet();
    storeMode='idb';
    const lu=(lsVal&&lsVal.meta&&lsVal.meta.updated)||0,iu=(v&&v.meta&&v.meta.updated)||0;
    const use=(lsVal&&lu>iu)?lsVal:v;
    if(use)db=Object.assign(db,use);
    return;
  }
  try{localStorage.setItem(DB_KEY+'-probe','1');localStorage.removeItem(DB_KEY+'-probe');
    if(lsVal)db=Object.assign(db,lsVal);
    storeMode='local';return;}catch(e){}
  storeMode='minne';
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,160);}
function dbSizeMB(){try{return JSON.stringify(db).length/1048576;}catch(e){return 0;}}
function saveErrTxt(e){
  if(!e)return 'ukjent feil';
  const n=e.name||'';
  if(n==='QuotaExceededError'||/quota/i.test(String(e.message||'')))return 'lagringsplassen er full (QuotaExceededError)';
  if(n==='DataCloneError')return 'dataene kunne ikke kopieres til lagringen (DataCloneError)';
  return (n||'Feil')+(e.message?': '+String(e.message).slice(0,120):'');
}
async function doSave(){
  if(saveBusy){saveAgain=true;return;}
  saveBusy=true;
  try{do{saveAgain=false;await doSaveOnce();}while(saveAgain);}finally{saveBusy=false;}
}
async function doSaveOnce(){
  if(!db.meta)db.meta={};
  db.meta.updated=Date.now();
  const causes=[];
  if(storeMode==='idb'&&idb){
    try{await idbPut(db);try{localStorage.removeItem(DB_KEY);}catch(e){}return saveOk();}catch(e){causes.push('IndexedDB: '+saveErrTxt(e));}
    try{await idbPut(JSON.parse(JSON.stringify(db)));try{localStorage.removeItem(DB_KEY);}catch(e){}return saveOk();}catch(e){causes.push('IndexedDB (nytt forsøk): '+saveErrTxt(e));}
    try{try{idb.close();}catch(e){}idb=await openIdb();if(idb){await idbPut(JSON.parse(JSON.stringify(db)));try{localStorage.removeItem(DB_KEY);}catch(e){}return saveOk();}}catch(e){causes.push('IndexedDB (ny tilkobling): '+saveErrTxt(e));}
  }
  if(storeMode==='local'||storeMode==='idb'){
    try{localStorage.setItem(DB_KEY,JSON.stringify(db));return saveOk();}catch(e){causes.push('localStorage: '+saveErrTxt(e));}
  }
  if(storeMode==='minne'){return;}
  saveFail(causes);
}
function saveOk(){if(saveErr){saveErr=null;renderWarn();toast('Lagringen fungerer igjen.');}}
function saveFail(causes){
  saveErr={at:Date.now(),causes:causes,mb:dbSizeMB()};
  renderWarn();
  if(Date.now()-lastWarn>20000){lastWarn=Date.now();toast('Lagring feilet ('+saveErr.mb.toFixed(1)+' MB): '+causes[causes.length-1]+'. Eksporter synkfila nå.');}
}
const WARN_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
function renderWarn(){
  const el=document.getElementById('warnbar');
  if(saveErr){el.className='warnbar';el.innerHTML=WARN_IC+'<div><b>Lagringen feilet</b> ('+saveErr.mb.toFixed(1)+' MB). '+saveErr.causes.map(c=>ttE(c)).join(' · ')+'. Det siste du gjorde er kanskje ikke lagret – eksporter synkfila under Synk nå.</div>';}
  else if(storeMode==='minne'){el.className='warnbar';el.innerHTML=WARN_IC+'<div><b>Ingen lagring tilgjengelig.</b> Data forsvinner når du lukker fanen. Eksporter synkfila før du går ut.</div>';}
  else{el.className='';el.innerHTML='';}
}
function ttStoreInfo(){
  const m=storeMode==='idb'?'IndexedDB':(storeMode==='local'?'localStorage':'kun minne');
  return 'Lagring: <b>'+m+'</b> · '+dbSizeMB().toFixed(1)+' MB'+(saveErr?' · <b style="color:var(--red)">siste lagring feilet</b>':'');
}

  kat:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7" cy="7" r="1.5"/>',

function ttNormUrl(u){u=String(u||'').trim();return u&&!/^[a-z][a-z0-9+.-]*:/i.test(u)?'https://'+u:u;}

function ttCopy(txt,btn){

  const fb=()=>{const a=document.createElement('textarea');a.value=txt;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(a);a.select();try{a.setSelectionRange(0,a.value.length);}catch(e){}let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();if(ok)done();else toast('Kunne ikke kopiere.');};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb);return;}}catch(e){}

function ttE(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- data ---------- */
function ttD(){
  if(!db.tt||typeof db.tt!=='object')db.tt={};
  const t=db.tt;
  if(!Array.isArray(t.items))t.items=[];
  if(!Array.isArray(t.deleted))t.deleted=[];
  if(!t.cats||typeof t.cats!=='object')t.cats={};
  ['loc','kol','stand'].forEach(k=>{if(!Array.isArray(t.cats[k]))t.cats[k]=TT_DEF[k].slice();});
  if(!Array.isArray(t.tags))t.tags=[];
  if(!db.meta)db.meta={};
  t.items.forEach(x=>{if(Array.isArray(x.bilder)&&x.bilder.some(b=>!b))x.bilder=x.bilder.filter(Boolean);});
  return t;
}
function ttUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function ttYmd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ttDato(s){return s?(s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4)):'';}
function ttKr(n){return (Math.round(Number(n)||0)).toLocaleString('nb-NO')+' kr';}
function ttGar(d){
  if(!d)return null;
  const a=new Date(d+'T12:00:00'),b=new Date(ttYmd()+'T12:00:00');
  if(isNaN(a))return null;
  const days=Math.round((a-b)/864e5);
  if(days<0)return {c:'exp',t:'Garanti utløpt '+ttDato(d)};
  if(days===0)return {c:'warn',t:'Garanti utløper i dag'};
  if(days<=90)return {c:'warn',t:'Garanti utløper om '+days+' d'};
  return {c:'ok',t:'Garanti til '+ttDato(d)};
}
function ttTotal(x){return (Number(x.verdi)||0)*(Number(x.antall)||1);}
const TT_FELT=[['alle','Alle felt'],['t','Beskriv'],['notat','Notat'],['serie','Serienummer'],['tags','Tags'],['sted','Sted'],['lev','Leverandør']];
let ttFelt=['alle'];
function ttWords(){return ttQ.toLowerCase().split(/\s+/).filter(Boolean);}
function ttFval(x,f){return f==='t'?x.t:f==='notat'?x.notat:f==='serie'?x.serie:f==='tags'?(x.tags||[]).join(' '):f==='sted'?[x.loc,x.kol,x.stand].join(' '):f==='lev'?[x.lev,x.url].join(' '):'';}
function ttFields(){return ttFelt.indexOf('alle')>=0?['t','notat','serie','tags','sted','lev']:ttFelt.slice();}
function ttMatch(x){
  const ws=ttWords();
  if(!ws.length)return true;
  const h=ttFields().map(f=>String(ttFval(x,f)==null?'':ttFval(x,f))).join(' ').toLowerCase()+(ttFelt.indexOf('alle')>=0?' '+[x.verdi,x.solgt].join(' ').toLowerCase():'');
  return ws.every(w=>h.includes(w));
}
function ttHl(s){
  s=String(s==null?'':s);const ws=ttWords();
  if(!ws.length)return ttE(s);
  const re=new RegExp('('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig');
  let out='',last=0,m;
  while((m=re.exec(s))){if(m[0]==='')break;out+=ttE(s.slice(last,m.index))+'<mark>'+ttE(m[0])+'</mark>';last=m.index+m[0].length;}
  return out+ttE(s.slice(last));
}
function ttSnippet(s){
  const ws=ttWords();if(!ws.length||!s)return '';
  const low=s.toLowerCase();let at=-1;
  ws.forEach(w=>{const i=low.indexOf(w);if(i>=0&&(at<0||i<at))at=i;});
  if(at<0)return '';
  const a=Math.max(0,at-28),b=Math.min(s.length,at+60);
  return (a>0?'… ':'')+s.slice(a,b)+(b<s.length?' …':'');
}
function ttTreffIn(x){
  const ws=ttWords();if(!ws.length)return [];
  const out=[];
  ttFields().forEach(f=>{const v=String(ttFval(x,f)||'').toLowerCase();if(ws.some(w=>v.includes(w)))out.push(TT_FELT.find(a=>a[0]===f)[1]);});
  return out;
}
function ttVisible(){
  const t=ttD();let l=t.items.filter(x=>ttMatch(x)&&ttKatMatch(x));
  if(db.meta.ttHideSold)l=l.filter(x=>!(Number(x.solgt)>0));
  const s=db.meta.ttSort||'nyeste';
  l=l.slice();
  if(s==='az')l.sort((a,b)=>(a.t||'').localeCompare(b.t||'','nb',{sensitivity:'base'}));
  else if(s==='verdi')l.sort((a,b)=>ttTotal(b)-ttTotal(a));
  else if(s==='garanti')l.sort((a,b)=>{const ga=a.garanti||'9999-99-99',gb=b.garanti||'9999-99-99';return ga<gb?-1:ga>gb?1:0;});
  else l.sort((a,b)=>(b.created||0)-(a.created||0));
  return l;
}

/* ---------- bilder ---------- */
function ttImageFrom(file){
  return new Promise(res=>{
    if(!file||!ttIsImg(file)){res('');return;}
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1000;let w=img.width,h=img.height;
      if(w>max||h>max){const sc=Math.min(max/w,max/h);w=Math.round(w*sc);h=Math.round(h*sc);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{res(cv.toDataURL('image/jpeg',0.8));}catch(e){res('');}
    };img.onerror=()=>res('');let u=String(r.result);if(!/^data:image\//.test(u)){const x=((file.name||'').match(/\.(\w+)$/)||[])[1]||'jpeg';const m={jpg:'jpeg',tif:'tiff'}[x.toLowerCase()]||x.toLowerCase();u=u.replace(/^data:[^,]*,/,'data:image/'+m+';base64,');}img.src=u;};
    r.onerror=()=>res('');
    r.readAsDataURL(file);
  });
}

let ttVw=null,ttVx0=null;
function ttViewer(list,i,label){
  list=(list||[]).filter(Boolean);if(!list.length)return;
  ttVw={list:list,i:Math.max(0,Math.min(i||0,list.length-1)),label:label||'Bilde'};

    el.addEventListener('click',ttVwClick);
    el.addEventListener('pointerdown',e=>{ttVx0=e.clientX;});
    el.addEventListener('pointerup',e=>{if(ttVx0==null)return;const dx=e.clientX-ttVx0;ttVx0=null;if(Math.abs(dx)>50)ttVwGo(dx<0?1:-1);});}

    '<div class="vm"><img src="'+ttVw.list[i]+'" alt="">'+(n>1?'<button type="button" class="va l" data-ttvp aria-label="Forrige"'+(i===0?' disabled':'')+'>‹</button><button type="button" class="va r" data-ttvn aria-label="Neste"'+(i===n-1?' disabled':'')+'>›</button>':'')+'</div>'+
    (n>1?'<div class="vd">'+ttVw.list.map((_,k)=>'<i class="'+(k===i?'on':'')+'" data-ttvd="'+k+'"></i>').join('')+'</div>':'')+'<div class="vh">'+(n>1?'← → på tastaturet · ':'')+'Esc lukker</div>';
}
function ttVwGo(d){if(!ttVw)return;const k=ttVw.i+d;if(k<0||k>=ttVw.list.length)return;ttVw.i=k;ttVwDraw();}
function ttVwClose(){ttVw=null;const el=document.getElementById('ttvw');if(el)el.remove();}
function ttVwClick(e){
  const T=s=>e.target.closest&&e.target.closest(s);let el;
  if(T('[data-ttvx]')){ttVwClose();return;}
  if(T('[data-ttvp]')){ttVwGo(-1);return;}

function ttSnap(){
  const v=document.getElementById('ttvid');
  if(!v||!v.videoWidth){toast('Kameraet er ikke klart ennå.');return;}
  ttGrab();
  const sc=Math.min(1,1000/Math.max(v.videoWidth,v.videoHeight));
  const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);

  if(!u){toast('Kunne ikke ta bildet.');return;}

  });
}
document.addEventListener('paste',e=>{
  if(!ttDraft||!document.getElementById('ttback'))return;
  const f=[].slice.call((e.clipboardData&&e.clipboardData.files)||[]).filter(ttIsImg);
  if(f.length){e.preventDefault();ttAddFiles(f);}
});
function ttHasFiles(e){return !!(e.dataTransfer&&[].slice.call(e.dataTransfer.types||[]).indexOf('Files')>=0);}
function ttWireDrop(b){
  let c=0;const hl=on=>{const g=document.getElementById('ttbg');if(g)g.classList.toggle('over',on);const z=document.getElementById('ttdz');if(z)z.classList.toggle('over',on);};
  b.addEventListener('dragenter',e=>{if(!ttHasFiles(e))return;e.preventDefault();c++;hl(true);});
  b.addEventListener('dragover',e=>{if(ttHasFiles(e)){e.preventDefault();try{e.dataTransfer.dropEffect='copy';}catch(x){}}});
  b.addEventListener('dragleave',()=>{c--;if(c<=0){c=0;hl(false);}});
  b.addEventListener('drop',e=>{e.preventDefault();c=0;hl(false);if(ttHasFiles(e))ttAddFiles(e.dataTransfer.files);});
}
function ttDlgAfter(){
  const v=document.getElementById('ttvid');if(v&&ttStream&&v.srcObject!==ttStream)v.srcObject=ttStream;
}
function ttGrab(){
  document.querySelectorAll('#ttdlg [data-ttf]').forEach(e=>{ttDraft[e.dataset.ttf]=e.value;});
  const tg=document.getElementById('ttf_tag');
  if(tg)ttDraft.pend=tg.value;
  return ttDraft.pend||'';
}
function ttDlgKey(e){
  if(!ttDraft)return;
  if(e.key==='Escape'){ttCloseDlg();return;}
  if(e.key==='Enter'&&e.target.id==='ttf_tag'){
    e.preventDefault();const v=e.target.value.trim().replace(/^#/,'');
    ttGrab();if(v&&!ttDraft.tags.includes(v))ttDraft.tags.push(v);ttDraft.pend='';
    ttDlgDraw();setTimeout(()=>{const n=document.getElementById('ttf_tag');if(n)n.focus();},10);return;
  }
  if(e.key==='Enter'&&e.target.id==='ttkn_in'){e.preventDefault();const b=document.querySelector('[data-ttkok]');if(b)b.click();}
}
function ttDlgChange(e){
  if(!ttDraft)return;
  if(e.target.id==='ttf_img'||e.target.id==='ttf_cam'||e.target.id==='ttf_kimg'||e.target.id==='ttf_kcam'){
    const files=[].slice.call(e.target.files||[]);const tg=/^ttf_k/.test(e.target.id)?'k':'b';e.target.value='';
    ttAddFiles(files,tg);
    return;
  }
  if(e.target.matches&&e.target.matches('#ttdlg [data-ttf]')){ttGrab();if(e.target.dataset.ttf==='garanti')ttDlgDraw();}
}
function ttDlgInput(e){
  const t=e.target;if(!ttDraft||!t||!t.dataset||(t.dataset.ttf!=='lev'&&t.dataset.ttf!=='url'))return;
  const l=document.getElementById('ttf_lev'),u=document.getElementById('ttf_url');if(!l||!u)return;
  const lo=document.getElementById('ttlone');if(lo)lo.textContent=ttOne(l.value,u.value)||'Fyll ut feltene for å kopiere en linje';
  const op=document.getElementById('ttop');if(op){const su=ttSafeUrl(u.value);if(su){op.href=su;op.style.display='';}else{op.removeAttribute('href');op.style.display='none';}}
}
function ttDlgClick(e){
  if(!ttDraft)return;
  const T=s=>e.target.closest&&e.target.closest(s);let el;
  if((el=T('[data-ttcp]'))){const f=document.getElementById(el.dataset.ttcp==='lev'?'ttf_lev':'ttf_url');const v=f?f.value.trim():'';if(!v){toast('Feltet er tomt.');return;}ttCopy(el.dataset.ttcp==='url'?ttNormUrl(v):v,el);return;}
  if((el=T('[data-ttcpone]'))){const l=document.getElementById('ttf_lev'),u=document.getElementById('ttf_url');ttCopy(ttOne(l&&l.value,u&&u.value),el);return;}
  if(T('[data-ttdupd]')){const id=ttDraft.id;if(!id)return;ttCloseDlg();ttOpen(id,true);toast('Kopi laget – ikke lagret ennå.');return;}
  if(T('[data-ttclose]')){ttCloseDlg();return;}
  if(T('[data-ttpick]')){const i=document.getElementById('ttf_img');if(i)i.click();return;}
  if(T('[data-ttcam]')){if(TT_MAC)ttCamStart();else{const i=document.getElementById('ttf_cam');if(i)i.click();}return;}
  if(T('[data-ttcamfile]')){const i=document.getElementById(ttDraft.camT==='k'?'ttf_kcam':'ttf_cam');if(i)i.click();return;}
  if(T('[data-ttkpick]')){const i=document.getElementById('ttf_kimg');if(i)i.click();return;}
  if(T('[data-ttkcam]')){if(TT_MAC)ttCamStart('k');else{const i=document.getElementById('ttf_kcam');if(i)i.click();}return;}
  if(T('[data-ttsnap]')){ttSnap();return;}
  if(T('[data-ttcamdone]')){ttGrab();ttCamStop();ttDlgDraw();return;}
  if((el=T('[data-ttknew]'))){ttGrab();ttDraft.addk=el.dataset.ttknew;ttDlgDraw();setTimeout(()=>{const i=document.getElementById('ttkn_in');if(i)i.focus();},10);return;}
  if((el=T('[data-ttkok]'))){
    const k=el.dataset.ttkok;const i=document.getElementById('ttkn_in');const v=i?i.value.trim():'';ttGrab();
    if(v){const t=ttD();if(!t.cats[k].includes(v))t.cats[k].push(v);ttDraft[k]=v;}
    ttDraft.addk='';ttDlgDraw();return;
  }
  if((el=T('[data-tttrm]'))){ttGrab();ttDraft.tags.splice(+el.dataset.tttrm,1);ttDlgDraw();return;}
  if((el=T('[data-ttsug]'))){ttGrab();ttDraft.tags.push(el.dataset.ttsug);ttDlgDraw();return;}
  if((el=T('[data-ttirm]'))){ttGrab();ttDraft.bilder.splice(+el.dataset.ttirm,1);ttDraft.imsg='';ttDlgDraw();return;}
  if((el=T('[data-ttkrm]'))){ttGrab();ttDraft.kvitt.splice(+el.dataset.ttkrm,1);ttDraft.kmsg='';ttDlgDraw();return;}
  if((el=T('[data-ttkzoom]'))){ttViewer(ttDraft.kvitt,+el.dataset.ttkzoom,'Kvittering');return;}
  if((el=T('[data-ttzoom]'))){ttViewer(ttDraft.bilder,+el.dataset.ttzoom,'Bilde');return;}
  if(T('[data-ttdelitem]')){
    if(!ttDraft.delAsk){ttGrab();ttDraft.delAsk=true;ttDlgDraw();return;}
    const t=ttD();const id=ttDraft.id;
    t.items=t.items.filter(x=>x.id!==id);t.deleted.push({id:id,deletedAt:Date.now()});
    save();ttCloseDlg();ttRepaint();toast('Slettet');return;
  }
  if(T('[data-ttsave]')){ttSaveDraft();return;}
}
function ttSaveDraft(){
  const pend=String(ttGrab()).trim().replace(/^#/,'');
  const d=ttDraft;
  if(pend&&!d.tags.includes(pend))d.tags.push(pend);
  if(!String(d.t||'').trim()){toast('Skriv en beskrivelse.');const f=document.getElementById('ttf_t');if(f)f.focus();return;}
  const t=ttD();const now=Date.now();
  const o={id:d.id||ttUid(),t:String(d.t).trim(),loc:d.loc||'',kol:d.kol||'',stand:d.stand||'',antall:Math.max(1,Number(d.antall)||1),serie:String(d.serie||'').trim(),
    verdi:d.verdi===''||d.verdi==null?'':Number(d.verdi),solgt:d.solgt===''||d.solgt==null?'':Number(d.solgt),garanti:d.garanti||'',anskaffet:d.anskaffet||'',lev:String(d.lev||'').trim(),url:String(d.url||'').trim(),notat:d.notat||'',
    tags:d.tags.slice(),bilder:d.bilder.slice(),kvitt:(d.kvitt||[]).slice(),updated:now};
  d.tags.forEach(g=>{if(!t.tags.includes(g))t.tags.push(g);});
  if(d.id){const i=t.items.findIndex(x=>x.id===d.id);const old=t.items[i];o.created=old?old.created||now:now;if(i>=0)t.items[i]=o;else t.items.push(o);}
  else{o.created=now;t.items.push(o);}
  save();ttCloseDlg();ttRepaint();toast('Lagret');
}
function ttConfirm(title,text,yes){
  const old=document.getElementById('ttcf');if(old)old.remove();
  const b=document.createElement('div');b.className='tt-back';b.id='ttcf';b.style.zIndex=9100;
  b.innerHTML='<div class="tt-dlg" style="max-width:380px;margin-top:80px"><div class="tt-dh">'+ttE(title)+'</div><div style="font-size:13.5px;margin-bottom:12px">'+ttE(text)+'</div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="tt-bt" id="ttcfno">Avbryt</button><button type="button" class="tt-bt dd" id="ttcfyes">Ja, fortsett</button></div></div>';
  document.body.appendChild(b);
  b.querySelector('#ttcfno').onclick=()=>b.remove();
  b.querySelector('#ttcfyes').onclick=()=>{b.remove();yes();};
  b.addEventListener('mousedown',e=>{if(e.target===b)b.remove();});
}

/* ---------- synk ---------- */
function ttStamp(d){const p=n=>String(n).padStart(2,'0');d=d||new Date();return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());}
function ttFilename(withImages,device){return 'TettPaa-TingTang-fra-'+(TT_MAC?'mac-til-iphone':'iphone-til-mac')+'-versjon'+BUILD_NO+'-'+ttStamp()+(withImages?'-med-bilder':'-uten-bilder')+(device?('_'+device):'')+'.json';}
function ttPayload(withImages){
  const t=ttD(),now=Date.now();
  const items=t.items.map(x=>{const o=Object.assign({},x);if(withImages){o.bilder=(x.bilder||[]).slice();o.kvitt=(x.kvitt||[]).slice();}else{delete o.bilder;delete o.kvitt;}o.tags=(x.tags||[]).slice();return o;});
  return {app:TT_SYNC_APP,version:TT_SYNC_VER,source:TT_MAC?'Mac':'iPhone',exportedAt:now,withImages:!!withImages,items:items,
    deleted:t.deleted.filter(d=>(now-(d.deletedAt||0))<TT_TOMB_MS),cats:{loc:t.cats.loc.slice(),kol:t.cats.kol.slice(),stand:t.cats.stand.slice()},tags:t.tags.slice(),skjema:db.meta.ttSkjemaAt?{lay:ttLay(),dens:ttDens(),tema:ttTema(),egen:ttEgen(),at:db.meta.ttSkjemaAt}:null};
}
const TT_DEVICES=['MacBaarbar','MacMini','iPad','iPhone'];
function ttDevicePick(withImages){
  const old=document.getElementById('ttdp');if(old)old.remove();
  const b=document.createElement('div');b.className='tt-back';b.id='ttdp';b.style.zIndex=9100;
  b.innerHTML='<div class="tt-dlg" style="max-width:340px;margin-top:80px"><div class="tt-dh" style="font-size:18px;color:var(--ink,#16201d)">Velg enhet</div>'+TT_DEVICES.map(d=>'<button type="button" class="tt-dp" data-ttdev="'+ttE(d)+'">'+ttE(d)+'</button>').join('')+'<div class="tt-dpf"><button type="button" id="ttdpno">Avbryt</button></div></div>';
  document.body.appendChild(b);
  b.addEventListener('mousedown',e=>{if(e.target===b)b.remove();});
  b.addEventListener('click',e=>{
    if(e.target.closest('#ttdpno')){b.remove();return;}
    const x=e.target.closest('[data-ttdev]');if(x){b.remove();ttExport(withImages,x.dataset.ttdev);}
  });
}
function ttExport(withImages,device){
  try{
    const data=JSON.stringify(ttPayload(withImages),null,1);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=ttFilename(withImages,device);
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    db.meta.ttLastSync=Date.now();save();
    toast('Synkfil eksportert'+(withImages?' (med bilder)':' (uten bilder)')+(device?' – '+device:''));
    ttRepaint();
  }catch(e){toast('Kunne ikke eksportere.');}
}
function ttParse(raw){
  let d;
  try{d=JSON.parse(raw);}catch(e){toast('Filen er ikke gyldig JSON.');return null;}
  if(!d||d.app!==TT_SYNC_APP||!Array.isArray(d.items)){toast('Dette er ikke en Ting & Tang-synkfil.');return null;}
  if((d.version||1)>TT_SYNC_VER){toast('Filen er laget av en nyere versjon.');return null;}
  return d;
}
function ttMergeCats(d){
  const t=ttD();
  if(d.cats&&typeof d.cats==='object')['loc','kol','stand'].forEach(k=>{(Array.isArray(d.cats[k])?d.cats[k]:[]).forEach(n=>{if(n&&typeof n==='string'&&!t.cats[k].includes(n))t.cats[k].push(n);});});
  (Array.isArray(d.tags)?d.tags:[]).forEach(g=>{if(g&&typeof g==='string'&&!t.tags.includes(g))t.tags.push(g);});
  // kategorier og tags som brukes av ting skal alltid finnes i listene
  t.items.forEach(x=>{['loc','kol','stand'].forEach(k=>{if(x[k]&&!t.cats[k].includes(x[k]))t.cats[k].push(x[k]);});(x.tags||[]).forEach(g=>{if(!t.tags.includes(g))t.tags.push(g);});});
}
function ttApply(raw,name){
  const d=ttParse(raw);if(!d)return;
  const t=ttD(),now=Date.now();
  const delMap={};
  [].concat(t.deleted||[],d.deleted||[]).forEach(x=>{if(x&&x.id){const at=x.deletedAt||0;if(!delMap[x.id]||at>delMap[x.id])delMap[x.id]=at;}});
  const map={};t.items.forEach(x=>{if(x&&x.id)map[x.id]=x;});
  let added=0,updated=0,removed=0,unchanged=0;
  d.items.forEach(x=>{
    if(!x||!x.id)return;
    const cur=map[x.id];
    if(!cur){const o=Object.assign({bilder:[],kvitt:[],tags:[]},x);if(!Array.isArray(o.bilder))o.bilder=[];if(!Array.isArray(o.kvitt))o.kvitt=[];map[x.id]=o;added++;return;}
    if((x.updated||0)>(cur.updated||0)){const o=Object.assign({},x);if(!('bilder' in x))o.bilder=cur.bilder||[];if(!('kvitt' in x))o.kvitt=cur.kvitt||[];if(!Array.isArray(o.kvitt))o.kvitt=[];if(!Array.isArray(o.tags))o.tags=[];map[x.id]=o;updated++;}else unchanged++;
  });
  Object.keys(delMap).forEach(id=>{const x=map[id];if(x&&(x.updated||0)<=delMap[id]){delete map[id];removed++;}});
  t.items=Object.keys(map).map(k=>map[k]);
  t.deleted=Object.keys(delMap).filter(id=>(now-delMap[id])<TT_TOMB_MS&&!map[id]).map(id=>({id:id,deletedAt:delMap[id]}));
  ttMergeCats(d);
  ttSkjemaIn(d,false);
  db.meta.ttLastSync=now;
  if(name)db.meta.ttLastImport={name:name,at:now};
  save();
  const src=d.source||'ukjent kilde',when=ttWhen(d.exportedAt);
  ttSyncFrom='Fra <b>'+ttE(src)+'</b>'+(when?', eksportert '+ttE(when):'')+(d.withImages===false?' · uten bilder':'');
  ttSyncResult=added+' nye · '+updated+' oppdatert · '+removed+' slettet · '+unchanged+' uendret';
  toast('Flettet fra '+src+': '+ttSyncResult);
  ttRepaint();
}
function ttReplace(raw,name){
  const d=ttParse(raw);if(!d)return;
  const t=ttD(),now=Date.now();
  const loc={};t.items.forEach(x=>{loc[x.id]=x;});
  t.items=d.items.filter(x=>x&&x.id).map(x=>{const o=Object.assign({tags:[]},x);if(!Array.isArray(o.bilder))o.bilder=(!('bilder' in x)&&loc[x.id]&&loc[x.id].bilder)?loc[x.id].bilder:[];if(!Array.isArray(o.kvitt))o.kvitt=(!('kvitt' in x)&&loc[x.id]&&loc[x.id].kvitt)?loc[x.id].kvitt:[];return o;});
  t.deleted=(Array.isArray(d.deleted)?d.deleted:[]).filter(x=>x&&x.id).map(x=>({id:x.id,deletedAt:x.deletedAt||0}));
  t.cats={loc:[],kol:[],stand:[]};t.tags=[];
  ['loc','kol','stand'].forEach(k=>{t.cats[k]=(d.cats&&Array.isArray(d.cats[k])?d.cats[k]:TT_DEF[k]).slice();});
  t.tags=(Array.isArray(d.tags)?d.tags:[]).slice();
  ttMergeCats({});
  ttSkjemaIn(d,true);
  db.meta.ttLastSync=now;
  if(name)db.meta.ttLastImport={name:name,at:now};
  save();
  ttSyncFrom='Fra <b>'+ttE(d.source||'ukjent kilde')+'</b>';
  ttSyncResult='Erstattet – '+t.items.length+' ting hentet fra fila';
  toast('Alt erstattet med fila');
  ttRepaint();
}
function ttWireSync(host){
  const fi=host.querySelector('#ttfile'),fr=host.querySelector('#ttfile2'),dz=host.querySelector('#ttdrop');
  const read=(f,fn)=>{if(!f)return;const r=new FileReader();r.onload=()=>fn(String(r.result||''),f.name);r.readAsText(f);};
  if(fi)fi.onchange=()=>{const f=fi.files&&fi.files[0];fi.value='';read(f,ttApply);};
  if(fr)fr.onchange=()=>{const f=fr.files&&fr.files[0];fr.value='';if(f)ttConfirm('Erstatte alt med denne fila?','Alt som ligger i appen nå slettes og byttes ut med innholdet i fila. Ta gjerne en eksport først.',()=>read(f,ttReplace));};
  if(dz){
    dz.onclick=()=>{if(fi)fi.click();};
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};
    dz.ondragleave=()=>dz.classList.remove('drag');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');read(e.dataTransfer.files&&e.dataTransfer.files[0],ttApply);};
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ttDraft&&document.getElementById('ttback')&&!document.getElementById('ttcf')&&!document.getElementById('ttdp')&&!document.querySelector('.tt-lb2')){ttCloseDlg();return;}const dpk=document.getElementById('ttdp');if(dpk){dpk.remove();return;}const c=document.getElementById('ttcf');if(c){c.remove();return;}const l=document.querySelector('.tt-lb2');if(l){l.remove();return;}}},true);


/* ---------- skall ---------- */
function ttOnPaint(){
  const n=ttD().items.length;
  document.getElementById('hsub').textContent=n+' registrert · '+ttKr(ttD().items.reduce((a,x)=>a+ttTotal(x),0));
  document.getElementById('nav').innerHTML=TT_PAGES.map(a=>{const k=ttPageKey(a[0]);return '<button type="button" data-navp="'+k+'" class="'+(ttPage===k?'on':'')+'">'+ttSvg(a[2])+a[1]+'</button>';}).join('');
  const host=ttHost();
  if(host&&!host.querySelector('.ph-ver')){const d=document.createElement('div');d.className='ph-ver';d.textContent='TettPå Ting & Tang · versjon '+BUILD_NO+' · '+BUILD_DATE;host.appendChild(d);}
  renderWarn();
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-navp]');if(b){ttSetPage(b.dataset.navp);document.getElementById('ttv').scrollTop=0;}});
(async function(){
  await load();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  ttD();
  ttPaint();
})();
</script>
