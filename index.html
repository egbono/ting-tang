<body>
<header class="ph-h"><div class="a">Ting &amp; Tang</div><div class="b" id="hsub"></div></header>
<div id="warnbar"></div>
<main id="ttv"></main>
<nav class="ph-nav" id="nav"></nav>
<div id="toast"></div>
<script>
const BUILD_NO=4, BUILD_DATE='19.10.2026';
const TT_MAC=false;
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),3200);}

/* ---------- LAGRING: IndexedDB (bekreftet) -> localStorage -> minne ---------- */
const DB_KEY='tettpa-tingtang-iphone';
let db={tt:{},meta:{}};
let storeMode='minne', idb=null, saveErr=null, saveBusy=false, saveAgain=false, saveTimer=null, lastWarn=0;
function openIdb(){
  return new Promise(res=>{
    if(!('indexedDB' in window))return res(null);
    let req;
    try{req=indexedDB.open(DB_KEY,1);}catch(e){return res(null);}
    req.onupgradeneeded=()=>{try{req.result.createObjectStore('kv');}catch(e){}};
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>res(null);
    setTimeout(()=>res(null),2500);
  });
}
function idbGet(){
  return new Promise(res=>{
    if(!idb)return res(null);
    try{const r=idb.transaction('kv','readonly').objectStore('kv').get('state');
      r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}catch(e){res(null);}
  });
}
function idbPut(v){
  return new Promise((res,rej)=>{
    try{
      const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,'state');
      tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error||new Error('IndexedDB-feil'));tx.onabort=()=>rej(tx.error||new Error('IndexedDB avbrutt'));
    }catch(e){rej(e);}
  });
}
async function load(){
  idb=await openIdb();
  let lsVal=null;
  try{const raw=localStorage.getItem(DB_KEY);if(raw)lsVal=JSON.parse(raw);}catch(e){}
  if(idb){
    const v=await idbGet();
    storeMode='idb';
    const lu=(lsVal&&lsVal.meta&&lsVal.meta.updated)||0,iu=(v&&v.meta&&v.meta.updated)||0;
    const use=(lsVal&&lu>iu)?lsVal:v;
    if(use)db=Object.assign(db,use);
    return;
  }
  try{localStorage.setItem(DB_KEY+'-probe','1');localStorage.removeItem(DB_KEY+'-probe');
    if(lsVal)db=Object.assign(db,lsVal);
    storeMode='local';return;}catch(e){}
  storeMode='minne';
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,160);}
function dbSizeMB(){try{return JSON.stringify(db).length/1048576;}catch(e){return 0;}}
function saveErrTxt(e){
  if(!e)return 'ukjent feil';
  const n=e.name||'';
  if(n==='QuotaExceededError'||/quota/i.test(String(e.message||'')))return 'lagringsplassen er full (QuotaExceededError)';
  if(n==='DataCloneError')return 'dataene kunne ikke kopieres til lagringen (DataCloneError)';
  return (n||'Feil')+(e.message?': '+String(e.message).slice(0,120):'');
}
async function doSave(){
  if(saveBusy){saveAgain=true;return;}
  saveBusy=true;
  try{do{saveAgain=false;await doSaveOnce();}while(saveAgain);}finally{saveBusy=false;}
}
async function doSaveOnce(){
  if(!db.meta)db.meta={};
  db.meta.updated=Date.now();
  const causes=[];
  if(storeMode==='idb'&&idb){
    try{await idbPut(db);try{localStorage.removeItem(DB_KEY);}catch(e){}return saveOk();}catch(e){causes.push('IndexedDB: '+saveErrTxt(e));}
    try{await idbPut(JSON.parse(JSON.stringify(db)));try{localStorage.removeItem(DB_KEY);}catch(e){}return saveOk();}catch(e){causes.push('IndexedDB (nytt forsøk): '+saveErrTxt(e));}
    try{try{idb.close();}catch(e){}idb=await openIdb();if(idb){await idbPut(JSON.parse(JSON.stringify(db)));try{localStorage.removeItem(DB_KEY);}catch(e){}return saveOk();}}catch(e){causes.push('IndexedDB (ny tilkobling): '+saveErrTxt(e));}
  }
  if(storeMode==='local'||storeMode==='idb'){
    try{localStorage.setItem(DB_KEY,JSON.stringify(db));return saveOk();}catch(e){causes.push('localStorage: '+saveErrTxt(e));}
  }
  if(storeMode==='minne'){return;}
  saveFail(causes);
}
function saveOk(){if(saveErr){saveErr=null;renderWarn();toast('Lagringen fungerer igjen.');}}
function saveFail(causes){
  saveErr={at:Date.now(),causes:causes,mb:dbSizeMB()};
  renderWarn();
  if(Date.now()-lastWarn>20000){lastWarn=Date.now();toast('Lagring feilet ('+saveErr.mb.toFixed(1)+' MB): '+causes[causes.length-1]+'. Eksporter synkfila nå.');}
}
const WARN_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
function renderWarn(){
  const el=document.getElementById('warnbar');

/* ---------- data ---------- */
function ttD(){
  if(!db.tt||typeof db.tt!=='object')db.tt={};
  const t=db.tt;
  if(!Array.isArray(t.items))t.items=[];
  if(!Array.isArray(t.deleted))t.deleted=[];
  if(!t.cats||typeof t.cats!=='object')t.cats={};
  ['loc','kol','stand'].forEach(k=>{if(!Array.isArray(t.cats[k]))t.cats[k]=TT_DEF[k].slice();});
  if(!Array.isArray(t.tags))t.tags=[];
  if(!db.meta)db.meta={};
  t.items.forEach(x=>{if(Array.isArray(x.bilder)&&x.bilder.some(b=>!b))x.bilder=x.bilder.filter(Boolean);});
  return t;
}
function ttUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function ttYmd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ttDato(s){return s?(s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4)):'';}
function ttKr(n){return (Math.round(Number(n)||0)).toLocaleString('nb-NO')+' kr';}
function ttGar(d){
  if(!d)return null;
  const a=new Date(d+'T12:00:00'),b=new Date(ttYmd()+'T12:00:00');
  if(isNaN(a))return null;
  const days=Math.round((a-b)/864e5);
  if(days<0)return {c:'exp',t:'Garanti utløpt '+ttDato(d)};
  if(days===0)return {c:'warn',t:'Garanti utløper i dag'};
  if(days<=90)return {c:'warn',t:'Garanti utløper om '+days+' d'};
  return {c:'ok',t:'Garanti til '+ttDato(d)};
}
function ttTotal(x){return (Number(x.verdi)||0)*(Number(x.antall)||1);}
function ttMatch(x){
  const ws=ttQ.toLowerCase().split(/\s+/).filter(Boolean);
  if(!ws.length)return true;
  const h=[x.t,x.loc,x.kol,x.stand,x.serie,x.notat,(x.tags||[]).join(' '),x.verdi,x.solgt].join(' ').toLowerCase();
  return ws.every(w=>h.includes(w));
}
function ttVisible(){
  const t=ttD();let l=t.items.filter(ttMatch);
  if(db.meta.ttHideSold)l=l.filter(x=>!(Number(x.solgt)>0));
  const s=db.meta.ttSort||'nyeste';
  l=l.slice();
  if(s==='az')l.sort((a,b)=>(a.t||'').localeCompare(b.t||'','nb',{sensitivity:'base'}));
  else if(s==='verdi')l.sort((a,b)=>ttTotal(b)-ttTotal(a));
  else if(s==='garanti')l.sort((a,b)=>{const ga=a.garanti||'9999-99-99',gb=b.garanti||'9999-99-99';return ga<gb?-1:ga>gb?1:0;});
  else l.sort((a,b)=>(b.created||0)-(a.created||0));
  return l;
}

/* ---------- bilder ---------- */
function ttImageFrom(file){
  return new Promise(res=>{
    if(!file||!/^image\//.test(file.type||'')){res('');return;}
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1000;let w=img.width,h=img.height;
      if(w>max||h>max){const sc=Math.min(max/w,max/h);w=Math.round(w*sc);h=Math.round(h*sc);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{res(cv.toDataURL('image/jpeg',0.8));}catch(e){res('');}
    };img.onerror=()=>res('');img.src=String(r.result);};
    r.onerror=()=>res('');
    r.readAsDataURL(file);
  });
}

/* ---------- hendelser ---------- */
function ttInput(e){
  if(e.target&&e.target.id==='ttq'){ttQ=e.target.value;ttRefreshList();}
}
function ttKey(e){
  const k=e.target&&e.target.dataset&&e.target.dataset.ttkin;
  if(e.key==='Enter'&&k){e.preventDefault();const b=document.querySelector('[data-ttkadd="'+k+'"]');if(b)b.click();}
}
function ttClick(e){
  const T=s=>e.target.closest&&e.target.closest(s);
  let el;
  if((el=T('[data-ttpage]'))){ttSetPage(el.dataset.ttpage);return;}
  if(T('[data-ttnew]')){ttOpen(0);return;}
  if((el=T('[data-ttopen]'))){ttOpen(el.dataset.ttopen);return;}
  if(T('[data-ttfocus]')){const i=document.getElementById('ttq');if(i)i.focus();return;}
  if(T('[data-tttools]')){ttToolsOpen=!ttToolsOpen;ttPaint();return;}
  if((el=T('[data-ttsort]'))){db.meta.ttSort=el.dataset.ttsort;save();ttPaint();return;}
  if(T('[data-tthidesold]')){db.meta.ttHideSold=!db.meta.ttHideSold;save();ttPaint();return;}
  if(T('[data-ttshare]')){ttShare();return;}
  if((el=T('[data-ttkadd]'))){
    const k=el.dataset.ttkadd;const i=document.querySelector('[data-ttkin="'+k+'"]');const v=i?i.value.trim().replace(/^#/,''):'';
    if(!v)return;const t=ttD();
    if(k==='__tag'){if(!t.tags.includes(v))t.tags.push(v);}else{if(!t.cats[k].includes(v))t.cats[k].push(v);}
    save();ttPaint();return;
  }
  if((el=T('[data-ttkdel]'))){const p=el.dataset.ttkdel.split('|');ttD().cats[p[0]].splice(+p[1],1);save();ttPaint();return;}
  if((el=T('[data-tttdel]'))){
    const t=ttD();const g=t.tags.splice(+el.dataset.tttdel,1)[0];const now=Date.now();
    t.items.forEach(x=>{if((x.tags||[]).includes(g)){x.tags=x.tags.filter(y=>y!==g);x.updated=now;}});
    save();ttPaint();return;
  }
  if((el=T('[data-ttfz]'))){if(el.dataset.ttfz==='solgt')ttPurgeSold();else ttWipeAll();return;}
  if((el=T('[data-ttexport]'))){ttDevicePick(el.dataset.ttexport==='1');return;}
  if(T('[data-ttimport]')){const f=document.getElementById('ttfile');if(f)f.click();return;}
  if(T('[data-ttreplace]')){const f=document.getElementById('ttfile2');if(f)f.click();return;}
}
function ttShare(){
  const vis=ttVisible();
  if(!vis.length){toast('Ingen ting å dele.');return;}
  const txt='Ting & Tang ('+vis.length+')\n\n'+vis.map(x=>[x.t,[x.loc,x.kol,x.stand].filter(Boolean).join(' · '),x.serie?'S/N '+x.serie:'',x.verdi!==''&&x.verdi!=null?ttKr(x.verdi)+((Number(x.antall)||1)>1?' × '+x.antall:''):'',x.garanti?'Garanti til '+ttDato(x.garanti):'',Number(x.solgt)>0?'Solgt for '+ttKr(x.solgt):''].filter(Boolean).join(' – ')).join('\n');
  try{if(navigator.share){navigator.share({title:'Ting & Tang',text:txt}).catch(()=>{});return;}}catch(e){}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Lista er kopiert.'),()=>toast('Kunne ikke kopiere.'));return;}}catch(e){}
  toast('Kunne ikke dele lista her.');
}

function ttCamStop(){if(ttStream){try{ttStream.getTracks().forEach(x=>x.stop());}catch(e){}ttStream=null;}if(ttDraft){ttDraft.cam=false;}}

function ttSnap(){
  const v=document.getElementById('ttvid');
  if(!v||!v.videoWidth){toast('Kameraet er ikke klart ennå.');return;}
  ttGrab();
  const sc=Math.min(1,1000/Math.max(v.videoWidth,v.videoHeight));
  const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  let u='';try{u=c.toDataURL('image/jpeg',0.8);}catch(e){}
  if(!u){toast('Kunne ikke ta bildet.');return;}
  ttDraft.bilder.push(u);ttDraft.tatt=(ttDraft.tatt||0)+1;ttDraft.imsg='La til bilde fra kamera';ttDlgDraw();
}
function ttAddFiles(files){
  if(!ttDraft)return;

  const fl=all.filter(f=>/^image\//.test(f.type||''));
  const skip=all.length-fl.length;
  if(!fl.length){ttDraft.imsg=all.length?'Ingen bildefiler i det du valgte.':'';ttDlgDraw();return;}
  ttDraft.imsg='Legger til '+fl.length+' bilde'+(fl.length>1?'r':'')+' …';ttDlgDraw();
  Promise.all(fl.map(ttImageFrom)).then(r=>{
    if(!ttDraft)return;
    const ok=r.filter(Boolean),bad=fl.length-ok.length+skip;
    ttGrab();ttDraft.bilder=ttDraft.bilder.concat(ok);
    ttDraft.imsg='La til '+ok.length+' bilde'+(ok.length!==1?'r':'')+(bad?' ('+bad+' fil'+(bad>1?'er':'')+' kunne ikke brukes)':'');
    ttDlgDraw();
  });
}

  if((el=T('[data-tttrm]'))){ttGrab();ttDraft.tags.splice(+el.dataset.tttrm,1);ttDlgDraw();return;}
  if((el=T('[data-ttsug]'))){ttGrab();ttDraft.tags.push(el.dataset.ttsug);ttDlgDraw();return;}
  if((el=T('[data-ttirm]'))){ttGrab();ttDraft.bilder.splice(+el.dataset.ttirm,1);ttDraft.imsg='';ttDlgDraw();return;}

    if(!ttDraft.delAsk){ttGrab();ttDraft.delAsk=true;ttDlgDraw();return;}
    const t=ttD();const id=ttDraft.id;
    t.items=t.items.filter(x=>x.id!==id);t.deleted.push({id:id,deletedAt:Date.now()});

function ttSaveDraft(){

    verdi:d.verdi===''||d.verdi==null?'':Number(d.verdi),solgt:d.solgt===''||d.solgt==null?'':Number(d.solgt),garanti:d.garanti||'',notat:d.notat||'',
    tags:d.tags.slice(),bilder:d.bilder.slice(),updated:now};

/* ---------- synk ---------- */
function ttStamp(d){const p=n=>String(n).padStart(2,'0');d=d||new Date();return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());}
function ttFilename(withImages,device){return 'TettPaa-TingTang-fra-'+(TT_MAC?'mac-til-iphone':'iphone-til-mac')+'-versjon'+BUILD_NO+'-'+ttStamp()+(withImages?'-med-bilder':'-uten-bilder')+(device?('_'+device):'')+'.json';}
function ttPayload(withImages){
  const t=ttD(),now=Date.now();
  const items=t.items.map(x=>{const o=Object.assign({},x);if(withImages)o.bilder=(x.bilder||[]).slice();else delete o.bilder;o.tags=(x.tags||[]).slice();return o;});
  return {app:TT_SYNC_APP,version:TT_SYNC_VER,source:TT_MAC?'Mac':'iPhone',exportedAt:now,withImages:!!withImages,items:items,
    deleted:t.deleted.filter(d=>(now-(d.deletedAt||0))<TT_TOMB_MS),cats:{loc:t.cats.loc.slice(),kol:t.cats.kol.slice(),stand:t.cats.stand.slice()},tags:t.tags.slice()};
}
const TT_DEVICES=['MacBaarbar','MacMini','iPad','iPhone'];
function ttDevicePick(withImages){
  const old=document.getElementById('ttdp');if(old)old.remove();
  const b=document.createElement('div');b.className='tt-back';b.id='ttdp';b.style.zIndex=9100;

    const x=e.target.closest('[data-ttdev]');if(x){b.remove();ttExport(withImages,x.dataset.ttdev);}
  });

function ttExport(withImages,device){
  try{
    const data=JSON.stringify(ttPayload(withImages),null,1);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=ttFilename(withImages,device);
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    db.meta.ttLastSync=Date.now();save();
    toast('Synkfil eksportert'+(withImages?' (med bilder)':' (uten bilder)')+(device?' – '+device:''));
    ttRepaint();
  }catch(e){toast('Kunne ikke eksportere.');}
}
function ttParse(raw){
  let d;
  try{d=JSON.parse(raw);}catch(e){toast('Filen er ikke gyldig JSON.');return null;}
  if(!d||d.app!==TT_SYNC_APP||!Array.isArray(d.items)){toast('Dette er ikke en Ting & Tang-synkfil.');return null;}
  if((d.version||1)>TT_SYNC_VER){toast('Filen er laget av en nyere versjon.');return null;}
  return d;
}
function ttMergeCats(d){
  const t=ttD();
  if(d.cats&&typeof d.cats==='object')['loc','kol','stand'].forEach(k=>{(Array.isArray(d.cats[k])?d.cats[k]:[]).forEach(n=>{if(n&&typeof n==='string'&&!t.cats[k].includes(n))t.cats[k].push(n);});});
  (Array.isArray(d.tags)?d.tags:[]).forEach(g=>{if(g&&typeof g==='string'&&!t.tags.includes(g))t.tags.push(g);});
  // kategorier og tags som brukes av ting skal alltid finnes i listene
  t.items.forEach(x=>{['loc','kol','stand'].forEach(k=>{if(x[k]&&!t.cats[k].includes(x[k]))t.cats[k].push(x[k]);});(x.tags||[]).forEach(g=>{if(!t.tags.includes(g))t.tags.push(g);});});
}
function ttApply(raw,name){
  const d=ttParse(raw);if(!d)return;
  const t=ttD(),now=Date.now();
  const delMap={};
  [].concat(t.deleted||[],d.deleted||[]).forEach(x=>{if(x&&x.id){const at=x.deletedAt||0;if(!delMap[x.id]||at>delMap[x.id])delMap[x.id]=at;}});
  const map={};t.items.forEach(x=>{if(x&&x.id)map[x.id]=x;});
  let added=0,updated=0,removed=0,unchanged=0;
  d.items.forEach(x=>{
    if(!x||!x.id)return;
    const cur=map[x.id];
    if(!cur){const o=Object.assign({bilder:[],tags:[]},x);if(!Array.isArray(o.bilder))o.bilder=[];map[x.id]=o;added++;return;}
    if((x.updated||0)>(cur.updated||0)){const o=Object.assign({},x);if(!('bilder' in x))o.bilder=cur.bilder||[];if(!Array.isArray(o.tags))o.tags=[];map[x.id]=o;updated++;}else unchanged++;
  });
  Object.keys(delMap).forEach(id=>{const x=map[id];if(x&&(x.updated||0)<=delMap[id]){delete map[id];removed++;}});
  t.items=Object.keys(map).map(k=>map[k]);
  t.deleted=Object.keys(delMap).filter(id=>(now-delMap[id])<TT_TOMB_MS&&!map[id]).map(id=>({id:id,deletedAt:delMap[id]}));
  ttMergeCats(d);
  db.meta.ttLastSync=now;
  if(name)db.meta.ttLastImport={name:name,at:now};
  save();
  const src=d.source||'ukjent kilde',when=ttWhen(d.exportedAt);
  ttSyncFrom='Fra <b>'+ttE(src)+'</b>'+(when?', eksportert '+ttE(when):'')+(d.withImages===false?' · uten bilder':'');
  ttSyncResult=added+' nye · '+updated+' oppdatert · '+removed+' slettet · '+unchanged+' uendret';
  toast('Flettet fra '+src+': '+ttSyncResult);
  ttRepaint();
}
function ttReplace(raw,name){
  const d=ttParse(raw);if(!d)return;
  const t=ttD(),now=Date.now();
  const loc={};t.items.forEach(x=>{loc[x.id]=x;});
  t.items=d.items.filter(x=>x&&x.id).map(x=>{const o=Object.assign({tags:[]},x);if(!Array.isArray(o.bilder))o.bilder=(!('bilder' in x)&&loc[x.id]&&loc[x.id].bilder)?loc[x.id].bilder:[];return o;});
  t.deleted=(Array.isArray(d.deleted)?d.deleted:[]).filter(x=>x&&x.id).map(x=>({id:x.id,deletedAt:x.deletedAt||0}));
  t.cats={loc:[],kol:[],stand:[]};t.tags=[];
  ['loc','kol','stand'].forEach(k=>{t.cats[k]=(d.cats&&Array.isArray(d.cats[k])?d.cats[k]:TT_DEF[k]).slice();});
  t.tags=(Array.isArray(d.tags)?d.tags:[]).slice();
  ttMergeCats({});
  db.meta.ttLastSync=now;
  if(name)db.meta.ttLastImport={name:name,at:now};
  save();
  ttSyncFrom='Fra <b>'+ttE(d.source||'ukjent kilde')+'</b>';
  ttSyncResult='Erstattet – '+t.items.length+' ting hentet fra fila';
  toast('Alt erstattet med fila');
  ttRepaint();
}
function ttWireSync(host){
  const fi=host.querySelector('#ttfile'),fr=host.querySelector('#ttfile2'),dz=host.querySelector('#ttdrop');
  const read=(f,fn)=>{if(!f)return;const r=new FileReader();r.onload=()=>fn(String(r.result||''),f.name);r.readAsText(f);};
  if(fi)fi.onchange=()=>{const f=fi.files&&fi.files[0];fi.value='';read(f,ttApply);};
  if(fr)fr.onchange=()=>{const f=fr.files&&fr.files[0];fr.value='';if(f)ttConfirm('Erstatte alt med denne fila?','Alt som ligger i appen nå slettes og byttes ut med innholdet i fila. Ta gjerne en eksport først.',()=>read(f,ttReplace));};
  if(dz){
    dz.onclick=()=>{if(fi)fi.click();};
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};
    dz.ondragleave=()=>dz.classList.remove('drag');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');read(e.dataTransfer.files&&e.dataTransfer.files[0],ttApply);};
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ttDraft&&document.getElementById('ttback')&&!document.getElementById('ttcf')&&!document.getElementById('ttdp')&&!document.querySelector('.tt-lb2')){ttCloseDlg();return;}const dpk=document.getElementById('ttdp');if(dpk){dpk.remove();return;}const c=document.getElementById('ttcf');if(c){c.remove();return;}const l=document.querySelector('.tt-lb2');if(l){l.remove();return;}}},true);


/* ---------- skall ---------- */
function ttOnPaint(){
  const n=ttD().items.length;
  document.getElementById('hsub').textContent=n+' registrert · '+ttKr(ttD().items.reduce((a,x)=>a+ttTotal(x),0));
  document.getElementById('nav').innerHTML=TT_PAGES.map(a=>{const k=ttPageKey(a[0]);return '<button type="button" data-navp="'+k+'" class="'+(ttPage===k?'on':'')+'">'+ttSvg(a[2])+a[1]+'</button>';}).join('');
  const host=ttHost();
  if(host&&!host.querySelector('.ph-ver')){const d=document.createElement('div');d.className='ph-ver';d.textContent='TettPå Ting & Tang · versjon '+BUILD_NO+' · '+BUILD_DATE;host.appendChild(d);}
  renderWarn();
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-navp]');if(b){ttSetPage(b.dataset.navp);document.getElementById('ttv').scrollTop=0;}});
(async function(){
  await load();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  ttD();
  ttPaint();
})();
</script>
